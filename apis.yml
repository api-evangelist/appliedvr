aid: appliedvr
name: AppliedVR
description: >-
  AppliedVR is a virtual reality therapeutics company that combines immersive
  technology with proven cognitive behavioral and behavioral-science techniques
  to treat medical conditions, with a focus on chronic pain. Its lead product,
  RelieVRx, is the first FDA-authorized prescription VR device for chronic lower
  back pain, delivering automated, self-administered cognitive behavioral therapy
  in the patient's home. AppliedVR also offers the SustainVR and ITx immersive
  therapeutics platform and the AVR Pathway patient-support system, and validates
  its products through clinical academic research. The company operates as a
  regulated digital-therapeutics / medical-device business rather than a
  developer-facing API platform, so it publishes no public API, SDK, or developer
  portal at this time. This profile was surfaced as a Techstars portfolio company
  and added to the API Evangelist network for enrichment.
